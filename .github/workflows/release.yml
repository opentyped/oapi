name: Release packages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          for (const directory of readdirSync('packages')) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            if (pkg.version !== version) throw new Error(`${pkg.name}: expected version ${version}, found ${pkg.version}`);
          }
          JS
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run check
      - run: npm run pack:packages
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: .oapi/packages/*.tgz
          if-no-files-found: error
  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packages
      - name: Attach packages to the release
        run: gh release upload "$RELEASE_TAG" packages/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@opentyped'
      - name: Publish to GitHub Packages
        run: |
          for archive in packages/*.tgz; do
            npm publish "$archive" --registry https://npm.pkg.github.com --ignore-scripts
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
